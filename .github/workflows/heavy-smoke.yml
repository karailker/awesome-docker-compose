name: Heavy stacks smoke test

# Resource-hungry stacks: run weekly and on demand, not on every PR.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project:
          - base/elasticsearch
          - base/milvus
          - base/sonarqube
          - base/nexus
          - base/prefect
          - base/apache-airflow
          - base/feast
          - base/gitlab
          - stacks/mlflow-minio-postgres-pgadmin
          - stacks/mlflow-oidc-keycloak-minio-postgres-pgadmin
          - stacks/wandb-minio-postgres
          - stacks/rag-ollama-openwebui-qdrant
    steps:
      - uses: actions/checkout@v4
      - name: Raise vm.max_map_count (Elasticsearch / SonarQube)
        run: sudo sysctl -w vm.max_map_count=262144
      - run: scripts/smoke.sh "${{ matrix.project }}" 900

  image-pull:
    name: Pull all images (detect removed/renamed tags)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull images for every project
        run: |
          rc=0
          for f in $(find base stacks -name compose.yaml | sort); do
            d=$(dirname "$f")
            scripts/prepare-dirs.sh "$d"
            echo "::group::$d"
            (cd "$d" && docker compose pull --ignore-buildable --quiet) || { echo "::error::image pull failed in $d"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc

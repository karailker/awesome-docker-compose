name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    name: Discover projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          projects=$(find base stacks -name compose.yaml -printf '%h\n' | sort | jq -R . | jq -sc .)
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint YAML / JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install yamllint
      - run: yamllint -c .yamllint.yml .
      - name: Validate JSON files
        run: find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 python3 -m json.tool > /dev/null

  validate:
    name: Validate ${{ matrix.project }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: scripts/prepare-dirs.sh "${{ matrix.project }}"
      - name: docker compose config (with .env.example)
        working-directory: ${{ matrix.project }}
        run: docker compose config -q
      - name: docker compose config (defaults only)
        working-directory: ${{ matrix.project }}
        run: docker compose --env-file /dev/null config -q
      - name: Required files exist
        run: |
          for f in README.md compose.yaml .gitignore; do
            test -f "${{ matrix.project }}/$f" || { echo "::error::missing $f in ${{ matrix.project }}"; exit 1; }
          done

  dockerfile:
    name: Build FastAPI image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: base/fastapi/Dockerfile
          failure-threshold: error
      - run: docker build -t fastapi-example:ci base/fastapi

  smoke:
    name: Smoke test ${{ matrix.project }}
    needs: [lint, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project:
          - base/postgres
          - base/pgvector
          - base/mysql
          - base/mongodb
          - base/redis
          - base/valkey
          - base/rabbitmq
          - base/minio
          - base/qdrant
          - base/kafka
          - base/grafana
          - base/influxdb
          - base/clickhouse
          - base/cockroachdb
          - base/fastapi
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: scripts/prepare-dirs.sh "${{ matrix.project }}"
      - name: Start stack
        working-directory: ${{ matrix.project }}
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Show status
        if: always()
        working-directory: ${{ matrix.project }}
        run: docker compose ps -a
      - name: Fail on exited/unhealthy containers
        working-directory: ${{ matrix.project }}
        run: |
          bad=$(docker compose ps -a --format '{{.Name}} {{.State}} {{.Health}}' | awk '$2=="exited" && !/ 0$/ || $3=="unhealthy"')
          [ -z "$bad" ] || { echo "$bad"; exit 1; }
      - name: Logs on failure
        if: failure()
        working-directory: ${{ matrix.project }}
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        working-directory: ${{ matrix.project }}
        run: docker compose down -v

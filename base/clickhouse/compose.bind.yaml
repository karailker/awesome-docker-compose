# Store the data in host directories instead of Docker-managed volumes.
#
#   mkdir -p ${DATA_DIR:-.}/clickhouse_data ${DATA_DIR:-.}/clickhouse_logs ${DATA_DIR:-.}/clickhouse_config
#   docker compose -f compose.yaml -f compose.bind.yaml up -d
#
# DATA_DIR (default: this directory) can be set in .env or the environment.
volumes:
  clickhouse_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-.}/clickhouse_data
  clickhouse_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-.}/clickhouse_logs
  clickhouse_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-.}/clickhouse_config

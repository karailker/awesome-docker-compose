services:
  postgres:
    image: postgres:17
    container_name: metabase-postgres
    environment:
      POSTGRES_DB: ${METABASE_DB:-metabase}
      POSTGRES_USER: ${POSTGRES_USER:-metabase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metabase}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro # creates the sample "analytics" database on first start
    networks:
      - metabase_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metabase} -d ${METABASE_DB:-metabase}"]
      interval: 5s
      timeout: 5s
      retries: 20

  metabase:
    image: ${METABASE_IMAGE:-metabase/metabase:v0.64.1.3}
    container_name: metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${METABASE_DB:-metabase}
      MB_DB_USER: ${POSTGRES_USER:-metabase}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-metabase}
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_KEY:-change-me-to-a-long-random-string-0123456789}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${METABASE_PORT:-3000}:3000"
    networks:
      - metabase_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  postgres_data:
    name: ${VOLUME_PREFIX:-metabase}_postgres_data

networks:
  metabase_network:
    driver: bridge

services:
  prefect-server:
    image: ${PREFECT_IMAGE:-prefecthq/prefect:3-latest}
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"  # Prefect UI
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER:-myuser}:${POSTGRES_PASSWORD:-mypassword}@prefect_postgres:5432/${POSTGRES_DB:-mydatabase}
    depends_on:
      prefect_postgres:
        condition: service_healthy
    networks:
      - prefect_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  prefect-worker-1:
    image: ${PREFECT_IMAGE:-prefecthq/prefect:3-latest}
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    command: prefect worker start --pool default --type process
    networks:
      - prefect_network
    restart: unless-stopped

  prefect_postgres:
    image: postgres:17
    container_name: prefect_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - prefect_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-mydatabase}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: ${VOLUME_PREFIX:-prefect}_postgres_data

networks:
  prefect_network:
    driver: bridge
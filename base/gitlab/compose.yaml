services:
  postgresql:
    image: postgres:17
    container_name: gitlab_postgresql
    restart: unless-stopped
    # GitLab's schema needs far more than the default 64 locks per transaction: its migrations fail with
    # "ERROR: out of shared memory" otherwise and the Omnibus container restarts in a loop.
    command: ["postgres", "-c", "max_locks_per_transaction=256"]
    environment:
      POSTGRES_USER: gitlab
      POSTGRES_PASSWORD: ${GITLAB_DB_PASSWORD:-gitlab}
      POSTGRES_DB: gitlabhq_production
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - gitlab_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitlab -d gitlabhq_production"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: gitlab_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - gitlab_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  gitlab:
    image: gitlab/gitlab-ce:19.4.1-ce.0
    container_name: gitlab
    restart: unless-stopped
    hostname: gitlab.local
    shm_size: 256m   # GitLab's recommendation for Omnibus
    environment:
      # only applied when GitLab initialises an empty database (first start)
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD:-S3cureP@ssw0rd_2025}
      GITLAB_ROOT_EMAIL: ${GITLAB_ROOT_EMAIL:-admin@example.com}
      GITLAB_OMNIBUS_CONFIG: |
        # the URL users open (and that clone URLs / redirects use); nginx still listens on 80 inside the container
        external_url '${GITLAB_EXTERNAL_URL:-http://localhost:8090}'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2222}

        # --- External PostgreSQL ---
        gitlab_rails['db_adapter'] = 'postgresql'
        gitlab_rails['db_encoding'] = 'utf8'
        gitlab_rails['db_host'] = 'gitlab_postgresql'
        gitlab_rails['db_port'] = 5432
        gitlab_rails['db_username'] = 'gitlab'
        gitlab_rails['db_password'] = '${GITLAB_DB_PASSWORD:-gitlab}'
        gitlab_rails['db_database'] = 'gitlabhq_production'

        # --- External Redis ---
        gitlab_rails['redis_host'] = 'gitlab_redis'
        gitlab_rails['redis_port'] = 6379

        # --- Smaller footprint (a single-user dev instance): faster start, less memory ---
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 10
        prometheus_monitoring['enable'] = false

        # Optional: set timezone
        # gitlab_rails['time_zone'] = 'Europe/Istanbul'
    ports:
      - "${GITLAB_HTTP_PORT:-8090}:80"
      - "8093:443"     # enable only when HTTPS is configured in Omnibus
      - "${GITLAB_SSH_PORT:-2222}:22"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gitlab_network

networks:
  gitlab_network:
    driver: bridge

volumes:
  postgresql_data:
    name: ${VOLUME_PREFIX:-gitlab}_postgresql_data
  redis_data:
    name: ${VOLUME_PREFIX:-gitlab}_redis_data
  gitlab_config:
    name: ${VOLUME_PREFIX:-gitlab}_gitlab_config
  gitlab_logs:
    name: ${VOLUME_PREFIX:-gitlab}_gitlab_logs
  gitlab_data:
    name: ${VOLUME_PREFIX:-gitlab}_gitlab_data

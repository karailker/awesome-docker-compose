# Store the data in host directories instead of Docker-managed volumes.
#
#   mkdir -p ${DATA_DIR:-.}/postgresql ${DATA_DIR:-.}/redis ${DATA_DIR:-.}/config ${DATA_DIR:-.}/logs ${DATA_DIR:-.}/data
#   docker compose -f compose.yaml -f compose.bind.yaml up -d
#
# DATA_DIR (default: this directory) can be set in .env or the environment.
volumes:
  postgresql_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-.}/postgresql
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-.}/redis
  gitlab_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-.}/config
  gitlab_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-.}/logs
  gitlab_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-.}/data

services:
  redis:
    image: redis:8.10.2
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - redis_network

  redis-insight:
    image: redislabs/redisinsight:3.8.0
    container_name: redis-insight
    ports:
      - "5540:5540"
    environment:
      - REDIS_HOST=redis
    volumes:
      - redis_insight_data:/data
    profiles: ["redis-insight"]
    networks:
      - redis_network

volumes:
  redis_data:
    name: ${VOLUME_PREFIX:-redis}_redis_data
  redis_insight_data:
    name: ${VOLUME_PREFIX:-redis}_redis_insight_data

networks:
  redis_network:
    driver: bridge
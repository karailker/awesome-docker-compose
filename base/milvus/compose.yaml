services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=${ETCD_AUTO_COMPACTION_MODE:-revision}
      - ETCD_AUTO_COMPACTION_RETENTION=${ETCD_AUTO_COMPACTION_RETENTION:-1000}
      - ETCD_QUOTA_BACKEND_BYTES=${ETCD_QUOTA_BACKEND_BYTES:-4294967296}
      - ETCD_SNAPSHOT_COUNT=${ETCD_SNAPSHOT_COUNT:-50000}
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - milvus_network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  s3:
    # S3-compatible object store. Default: RustFS. Switch with an override file:
    #   -f compose.yaml -f compose.seaweedfs.yaml   or   -f compose.yaml -f compose.garage.yaml
    # Whatever the variant, the S3 API is http://s3:9000 inside the network and on localhost:9000.
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.1}
    container_name: milvus-s3
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # RustFS console
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-GKdeadbeefdeadbeefdeadbeef}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - s3_data:/data
    networks:
      - milvus_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  create-bucket:
    # One-shot job: creates the bucket(s) in S3_BUCKETS (space separated) if they do not exist yet.
    image: ${AWSCLI_IMAGE:-amazon/aws-cli:2.37.11}
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-GKdeadbeefdeadbeefdeadbeef}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKETS: ${S3_BUCKET:-a-bucket}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for b in $$S3_BUCKETS; do
          until aws --endpoint-url http://s3:9000 s3api head-bucket --bucket "$$b" 2>/dev/null \
             || aws --endpoint-url http://s3:9000 s3 mb "s3://$$b"; do sleep 2; done
          echo "bucket $$b is ready"
        done
    networks:
      - milvus_network
    restart: "no"

  standalone:
    image: milvusdb/milvus:v2.5.7
    container_name: milvus-standalone
    environment:
      - ETCD_ENDPOINTS=${ETCD_ENDPOINTS:-etcd:2379}
      # Milvus calls its object store "MinIO"; any S3-compatible service works
      - MINIO_ADDRESS=${S3_ADDRESS:-s3:9000}
      - MINIO_ACCESS_KEY_ID=${S3_ACCESS_KEY:-GKdeadbeefdeadbeefdeadbeef}
      - MINIO_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
      - MINIO_BUCKET_NAME=${S3_BUCKET:-a-bucket}
      - MINIO_REGION=${AWS_REGION:-us-east-1}
    volumes:
      - milvus_data:/var/lib/milvus
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    networks:
      - milvus_network
    depends_on:
      etcd:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    security_opt:
      - seccomp:unconfined

volumes:
  etcd_data:
    name: ${VOLUME_PREFIX:-milvus}_etcd_data
  s3_data:
    name: ${VOLUME_PREFIX:-milvus}_s3_data
  milvus_data:
    name: ${VOLUME_PREFIX:-milvus}_milvus_data

networks:
  milvus_network:
    driver: bridge
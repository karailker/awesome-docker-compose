services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=${ETCD_AUTO_COMPACTION_MODE:-revision}
      - ETCD_AUTO_COMPACTION_RETENTION=${ETCD_AUTO_COMPACTION_RETENTION:-1000}
      - ETCD_QUOTA_BACKEND_BYTES=${ETCD_QUOTA_BACKEND_BYTES:-4294967296}
      - ETCD_SNAPSHOT_COUNT=${ETCD_SNAPSHOT_COUNT:-50000}
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - milvus_network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  s3:
    # S3-compatible object store (RustFS by default; compose.seaweedfs.yaml / compose.garage.yaml switch it).
    # Defined once in shared/s3/compose.yaml. The S3 API is http://s3:9000 for every variant.
    extends:
      file: ../../shared/s3/compose.yaml
      service: s3
    container_name: milvus-s3
    networks:
      - milvus_network

  create-bucket:
    extends:
      file: ../../shared/s3/compose.yaml
      service: create-bucket
    environment:
      S3_BUCKETS: ${S3_BUCKET:-a-bucket}
    networks:
      - milvus_network

  standalone:
    image: milvusdb/milvus:v2.5.7
    container_name: milvus-standalone
    environment:
      - ETCD_ENDPOINTS=${ETCD_ENDPOINTS:-etcd:2379}
      # Milvus calls its object store "MinIO"; any S3-compatible service works
      - MINIO_ADDRESS=${S3_ADDRESS:-s3:9000}
      - MINIO_ACCESS_KEY_ID=${S3_ACCESS_KEY:-GKdeadbeefdeadbeefdeadbeef}
      - MINIO_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
      - MINIO_BUCKET_NAME=${S3_BUCKET:-a-bucket}
      - MINIO_REGION=${AWS_REGION:-us-east-1}
    volumes:
      - milvus_data:/var/lib/milvus
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    networks:
      - milvus_network
    depends_on:
      etcd:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    security_opt:
      - seccomp:unconfined

volumes:
  etcd_data:
    name: ${VOLUME_PREFIX:-milvus}_etcd_data
  s3_data:
    name: ${VOLUME_PREFIX:-milvus}_s3_data
  milvus_data:
    name: ${VOLUME_PREFIX:-milvus}_milvus_data

networks:
  milvus_network:
    driver: bridge
# Store the data in host directories instead of Docker-managed volumes.
#
#   mkdir -p ${DATA_DIR:-.}/milvus_data/etcd ${DATA_DIR:-.}/milvus_data/minio ${DATA_DIR:-.}/milvus_data/milvus
#   docker compose -f compose.yaml -f compose.bind.yaml up -d
#
# DATA_DIR (default: this directory) can be set in .env or the environment.
volumes:
  etcd_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-.}/milvus_data/etcd
  minio_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-.}/milvus_data/minio
  milvus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-.}/milvus_data/milvus

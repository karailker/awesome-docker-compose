# Store the data in host directories instead of Docker-managed volumes.
#
#   mkdir -p ${DATA_DIR:-.}/sonarqube_data ${DATA_DIR:-.}/sonarqube_extensions ${DATA_DIR:-.}/sonarqube_logs ${DATA_DIR:-.}/postgres_data
#   docker compose -f compose.yaml -f compose.bind.yaml up -d
#
# DATA_DIR (default: this directory) can be set in .env or the environment.
volumes:
  sonarqube_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-.}/sonarqube_data
  sonarqube_extensions:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-.}/sonarqube_extensions
  sonarqube_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-.}/sonarqube_logs
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-.}/postgres_data

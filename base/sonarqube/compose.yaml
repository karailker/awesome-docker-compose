services:
  sonarqube:
    image: ${SONARQUBE_IMAGE:-sonarqube:25.10.0.114319-community}
    container_name: sonarqube
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sonar}
      SONAR_JDBC_USERNAME: ${POSTGRES_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-sonarpass}
      SONAR_ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      SONAR_WEB_CONTEXT: /
      SONAR_WEB_HOST: 0.0.0.0
      SONAR_WEB_PORT: 9000
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - sonar-net

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17}
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sonar}
      POSTGRES_USER: ${POSTGRES_USER:-sonar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonarpass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sonar} -d ${POSTGRES_DB:-sonar} -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - sonar-net

volumes:
  sonarqube_data:
    driver: local
    driver_opts:
      type: none
      device: ./sonarqube_data
      o: bind
  sonarqube_extensions:
    driver: local
    driver_opts:
      type: none
      device: ./sonarqube_extensions
      o: bind
  sonarqube_logs:
    driver: local
    driver_opts:
      type: none
      device: ./sonarqube_logs
      o: bind
  postgres_data:
    driver: local
    driver_opts:
      type: none
      device: ./postgres_data
      o: bind

networks:
  sonar-net:
    driver: bridge

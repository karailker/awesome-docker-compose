services:
  cockroach:
    image: ${COCKROACH_IMAGE:-cockroachdb/cockroach:v25.2.6}
    container_name: cockroach
    command: start-single-node --insecure --store=/cockroach/cockroach-data --http-addr=0.0.0.0:8080
    ports:
      - "${COCKROACH_SQL_PORT:-26257}:26257"   # SQL
      - "${COCKROACH_GRPC_PORT:-26357}:26357"   # gRPC
      - "${COCKROACH_HTTP_PORT:-8088}:8080"   # Admin UI / Prom metrics
    environment:
      COCKROACH_DATABASE: ${COCKROACH_DATABASE:-appdb}
    volumes:
      - cockroach_data:/cockroach/cockroach-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health?ready=1 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - cockroach-net

  initdb:
    image: ${COCKROACH_IMAGE:-cockroachdb/cockroach:v25.2.6}
    container_name: cockroach_init
    depends_on:
      cockroach:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        cockroach sql --insecure --host=cockroach:26257 -e
        "CREATE DATABASE IF NOT EXISTS ${COCKROACH_DATABASE:-appdb};
        CREATE USER IF NOT EXISTS ${COCKROACH_USER:-app};
        GRANT ALL ON DATABASE ${COCKROACH_DATABASE:-appdb} TO ${COCKROACH_USER:-app};"
        && echo 'CockroachDB init completed.'
    profiles: ["init"]
    networks:
      - cockroach-net
    restart: "no"

volumes:
  cockroach_data:
    name: ${VOLUME_PREFIX:-cockroachdb}_cockroach_data

networks:
  cockroach-net:
    driver: bridge

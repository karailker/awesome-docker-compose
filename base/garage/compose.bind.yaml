# Store the data in host directories instead of Docker-managed volumes.
#
#   mkdir -p ${DATA_DIR:-.}/garage_meta ${DATA_DIR:-.}/garage_data
#   docker compose -f compose.yaml -f compose.bind.yaml up -d
#
# DATA_DIR (default: this directory) can be set in .env or the environment.
volumes:
  garage_meta:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-.}/garage_meta
  garage_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-.}/garage_data

x-mlflow-creds: &mlflow-creds
  AWS_ACCESS_KEY_ID:      ${S3_ACCESS_KEY:-GKdeadbeefdeadbeefdeadbeef}
  AWS_SECRET_ACCESS_KEY:  ${S3_SECRET_KEY:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
  MLFLOW_S3_ENDPOINT_URL: http://s3:9000
  AWS_REGION:             ${AWS_REGION:-us-east-1}

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    container_name: mlflow_server
    depends_on:
      postgres:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    restart: unless-stopped
    environment:
      <<: *mlflow-creds
      AWS_SSL_VERIFY: "0"

      # --- OIDC (Keycloak) ---
      OIDC_DISCOVERY_URL:  http://keycloak:8081/realms/mlflow/.well-known/openid-configuration
      OIDC_CLIENT_ID:      mlflow-client
      OIDC_CLIENT_SECRET:  ${OIDC_CLIENT_SECRET:-mlflowsecret}
      OIDC_REDIRECT_URI:   http://localhost:5000/callback
      OIDC_SCOPE:          "openid profile email"
      OIDC_PROVIDER_TYPE:  oidc
      OIDC_PROVIDER_DISPLAY_NAME: "Login with Keycloak"
      OIDC_GROUP_NAME:     mlflow-users

      OAUTHLIB_INSECURE_TRANSPORT: "1"
      MLFLOW_LOGGING_LEVEL: DEBUG
      LOG_LEVEL: DEBUG
    command: >
      /bin/sh -c "
      pip install --no-cache-dir --upgrade psycopg2-binary boto3 'mlflow-oidc-auth[full]==5.6.1' &&
      mlflow server --app-name oidc-auth --host 0.0.0.0 --port 5000
                    --backend-store-uri postgresql+psycopg2://myuser:mypassword@postgres:5432/mydatabase
                    --default-artifact-root s3://mlflow/
      "
    ports:
      - "5000:5000"
    networks:
      - mflow-stack-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # (Opsiyonel) Tarayıcı yönlendirmeleri için frontend-url tanımlamak istersen:
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      # KC_PROXY: "edge"
      KC_HTTP_PORT: 8081
      KC_LOG_LEVEL: INFO
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak/realm-mlflow.json:/opt/keycloak/data/import/realm-mlflow.json:ro
      - keycloak_data:/opt/keycloak/data   # Kalıcılık istiyorsan yorumdan çıkar
    networks:
      - mflow-stack-network
    restart: unless-stopped

  s3:
    # S3-compatible object store. Default: RustFS. Switch with an override file:
    #   -f compose.yaml -f compose.seaweedfs.yaml   or   -f compose.yaml -f compose.garage.yaml
    # Whatever the variant, the S3 API is http://s3:9000 inside the network and on localhost:9000.
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.1}
    container_name: s3
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # RustFS console
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-GKdeadbeefdeadbeefdeadbeef}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - s3_data:/data
    networks:
      - mflow-stack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  create-bucket:
    # One-shot job: creates the bucket(s) in S3_BUCKETS (space separated) if they do not exist yet.
    image: ${AWSCLI_IMAGE:-amazon/aws-cli:2.37.11}
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-GKdeadbeefdeadbeefdeadbeef}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKETS: mlflow
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for b in $$S3_BUCKETS; do
          until aws --endpoint-url http://s3:9000 s3api head-bucket --bucket "$$b" 2>/dev/null \
             || aws --endpoint-url http://s3:9000 s3 mb "s3://$$b"; do sleep 2; done
          echo "bucket $$b is ready"
        done
    networks:
      - mflow-stack-network
    restart: "no"

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mflow-stack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-mydatabase}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: elestio/pgadmin:REL-9_18
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-adminpassword}
    depends_on:
      - postgres
    ports:
      - "5433:80"
    networks:
      - mflow-stack-network
    restart: unless-stopped

volumes:
  s3_data:
    name: ${VOLUME_PREFIX:-mlflow-oidc-keycloak-minio-postgres-pgadmin}_s3_data
  postgres_data:
    name: ${VOLUME_PREFIX:-mlflow-oidc-keycloak-minio-postgres-pgadmin}_postgres_data
  keycloak_data:
    name: ${VOLUME_PREFIX:-mlflow-oidc-keycloak-minio-postgres-pgadmin}_keycloak_data

networks:
  mflow-stack-network:
    driver: bridge

x-mlflow-creds: &mlflow-creds
  AWS_ACCESS_KEY_ID:      ${S3_ACCESS_KEY:-GKdeadbeefdeadbeefdeadbeef}
  AWS_SECRET_ACCESS_KEY:  ${S3_SECRET_KEY:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
  MLFLOW_S3_ENDPOINT_URL: http://s3:9000
  AWS_REGION:             ${AWS_REGION:-us-east-1}

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    container_name: mlflow_server
    depends_on:
      postgres:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    restart: unless-stopped
    environment:
      <<: *mlflow-creds
      AWS_SSL_VERIFY: "0"

      # --- OIDC (Keycloak) ---
      OIDC_DISCOVERY_URL:  http://keycloak:8081/realms/mlflow/.well-known/openid-configuration
      OIDC_CLIENT_ID:      mlflow-client
      OIDC_CLIENT_SECRET:  ${OIDC_CLIENT_SECRET:-mlflowsecret}
      OIDC_REDIRECT_URI:   http://localhost:5000/callback
      OIDC_SCOPE:          "openid profile email"
      OIDC_PROVIDER_TYPE:  oidc
      OIDC_PROVIDER_DISPLAY_NAME: "Login with Keycloak"
      OIDC_GROUP_NAME:     mlflow-users

      OAUTHLIB_INSECURE_TRANSPORT: "1"
      MLFLOW_LOGGING_LEVEL: DEBUG
      LOG_LEVEL: DEBUG
    command: >
      /bin/sh -c "
      pip install --no-cache-dir --upgrade psycopg2-binary boto3 'mlflow-oidc-auth[full]==5.6.1' &&
      mlflow server --app-name oidc-auth --host 0.0.0.0 --port 5000
                    --backend-store-uri postgresql+psycopg2://myuser:mypassword@postgres:5432/mydatabase
                    --default-artifact-root s3://mlflow/
      "
    ports:
      - "5000:5000"
    networks:
      - mflow-stack-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # (Opsiyonel) Tarayıcı yönlendirmeleri için frontend-url tanımlamak istersen:
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      # KC_PROXY: "edge"
      KC_HTTP_PORT: 8081
      KC_LOG_LEVEL: INFO
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak/realm-mlflow.json:/opt/keycloak/data/import/realm-mlflow.json:ro
      - keycloak_data:/opt/keycloak/data   # Kalıcılık istiyorsan yorumdan çıkar
    networks:
      - mflow-stack-network
    restart: unless-stopped

  s3:
    # S3-compatible object store (RustFS by default; compose.seaweedfs.yaml / compose.garage.yaml switch it).
    # Defined once in shared/s3/compose.yaml. The S3 API is http://s3:9000 for every variant.
    extends:
      file: ../../shared/s3/compose.yaml
      service: s3
    networks:
      - mflow-stack-network

  create-bucket:
    extends:
      file: ../../shared/s3/compose.yaml
      service: create-bucket
    environment:
      S3_BUCKETS: mlflow
    networks:
      - mflow-stack-network

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mflow-stack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-mydatabase}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: elestio/pgadmin:REL-9_18
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-adminpassword}
    depends_on:
      - postgres
    ports:
      - "5433:80"
    networks:
      - mflow-stack-network
    restart: unless-stopped

volumes:
  s3_data:
    name: ${VOLUME_PREFIX:-mlflow-oidc-keycloak-minio-postgres-pgadmin}_s3_data
  postgres_data:
    name: ${VOLUME_PREFIX:-mlflow-oidc-keycloak-minio-postgres-pgadmin}_postgres_data
  keycloak_data:
    name: ${VOLUME_PREFIX:-mlflow-oidc-keycloak-minio-postgres-pgadmin}_keycloak_data

networks:
  mflow-stack-network:
    driver: bridge

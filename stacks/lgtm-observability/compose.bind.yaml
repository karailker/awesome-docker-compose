# Store the data in host directories instead of Docker-managed volumes.
#
#   mkdir -p ${DATA_DIR:-.}/loki_data ${DATA_DIR:-.}/tempo_data ${DATA_DIR:-.}/prometheus_data ${DATA_DIR:-.}/grafana_data ${DATA_DIR:-.}/alertmanager_data
#   docker compose -f compose.yaml -f compose.bind.yaml up -d
#
# DATA_DIR (default: this directory) can be set in .env or the environment.
volumes:
  loki_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-.}/loki_data
  tempo_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-.}/tempo_data
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-.}/prometheus_data
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-.}/grafana_data
  alertmanager_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-.}/alertmanager_data

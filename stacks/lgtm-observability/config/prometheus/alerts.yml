groups:
  - name: stack
    rules:
      # Always firing: proves that Prometheus -> Alertmanager works. Route it to a dead man's switch
      # (for example healthchecks.io) in a real setup.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: Alerting pipeline is working (this alert always fires)
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} on {{ $labels.instance }} is down"
  - name: traces
    rules:
      # RED metrics generated by Tempo from the spans (span-metrics processor)
      - alert: HighSpanErrorRate
        expr: |
          sum by (service) (rate(traces_spanmetrics_calls_total{status_code="STATUS_CODE_ERROR"}[5m]))
            / sum by (service) (rate(traces_spanmetrics_calls_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of the spans of {{ $labels.service }} are errors"
      - alert: SlowSpans
        expr: |
          histogram_quantile(0.95, sum by (le, service) (rate(traces_spanmetrics_latency_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 span latency of {{ $labels.service }} is above 2 s"

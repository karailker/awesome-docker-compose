x-s3-creds: &s3-creds
  AWS_ACCESS_KEY_ID:      ${S3_ACCESS_KEY:-GKdeadbeefdeadbeefdeadbeef}
  AWS_SECRET_ACCESS_KEY:  ${S3_SECRET_KEY:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
  AWS_REGION:             ${AWS_REGION:-us-east-1}
  S3_ENDPOINT_URL:        http://s3:9000
  S3_BUCKET:              ${S3_BUCKET:-wandb-bucket}

services:
  wandb:
    image: wandb/local:0.85.1
    container_name: wandb_local
    depends_on:
      mysql:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      # --- MySQL metadata store ---
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wandb}
      MYSQL_USER: ${MYSQL_USER:-wandbuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wandbpass}

      # --- Object store (RustFS / SeaweedFS / Garage, see compose.<variant>.yaml) ---
      <<: *s3-creds
      S3_SECURE: "false"              # http (TLS yok) için
      # Bazı kurulumlarda aşağıdakiler tercih edilir (ikisi de bırakıldı):
      WANDB_S3_ENDPOINT: http://s3:9000
      WANDB_S3_BUCKET: ${S3_BUCKET:-wandb-bucket}

      # --- Opsiyonel genel ayarlar ---
      # BASE_URL bir reverse proxy arkasında çalışırken gerekir:
      # BASE_URL: ${WANDB_BASE_URL}
      # DISABLE_SIGNUP: "false"

    ports:
      - "8088:8080"   # W&B Local UI
    volumes:
      - wandb_data:/vol
    networks:
      - wandb-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

  s3:
    # S3-compatible object store. Default: RustFS. Switch with an override file:
    #   -f compose.yaml -f compose.seaweedfs.yaml   or   -f compose.yaml -f compose.garage.yaml
    # Whatever the variant, the S3 API is http://s3:9000 inside the network and on localhost:9000.
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.1}
    container_name: s3
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # RustFS console
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-GKdeadbeefdeadbeefdeadbeef}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - s3_data:/data
    networks:
      - wandb-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  create-bucket:
    # One-shot job: creates the bucket(s) in S3_BUCKETS (space separated) if they do not exist yet.
    image: ${AWSCLI_IMAGE:-amazon/aws-cli:2.37.11}
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-GKdeadbeefdeadbeefdeadbeef}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKETS: ${S3_BUCKET:-wandb-bucket}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for b in $$S3_BUCKETS; do
          until aws --endpoint-url http://s3:9000 s3api head-bucket --bucket "$$b" 2>/dev/null \
             || aws --endpoint-url http://s3:9000 s3 mb "s3://$$b"; do sleep 2; done
          echo "bucket $$b is ready"
        done
    networks:
      - wandb-net
    restart: "no"

  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wandb}
      MYSQL_USER: ${MYSQL_USER:-wandbuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wandbpass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    command: >
      --mysql-native-password=ON
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - wandb-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${MYSQL_USER:-wandbuser} -p${MYSQL_PASSWORD:-wandbpass} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  wandb_data:
    name: ${VOLUME_PREFIX:-wandb-minio-postgres}_wandb_data
  s3_data:
    name: ${VOLUME_PREFIX:-wandb-minio-postgres}_s3_data
  mysql_data:
    name: ${VOLUME_PREFIX:-wandb-minio-postgres}_mysql_data

networks:
  wandb-net:
    driver: bridge

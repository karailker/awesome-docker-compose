x-s3-creds: &s3-creds
  AWS_ACCESS_KEY_ID:      ${MINIO_ROOT_USER:-minioadmin}
  AWS_SECRET_ACCESS_KEY:  ${MINIO_ROOT_PASSWORD:-minioadmin}
  AWS_REGION:             ${AWS_REGION:-us-east-1}
  S3_ENDPOINT_URL:        http://minio:9000
  S3_BUCKET:              ${MINIO_BUCKET_NAME:-wandb-bucket}

services:
  wandb:
    image: wandb/local:latest
    container_name: wandb_local
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    environment:
      # --- MySQL metadata store ---
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wandb}
      MYSQL_USER: ${MYSQL_USER:-wandbuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wandbpass}

      # --- Object store (MinIO / S3) ---
      <<: *s3-creds
      S3_SECURE: "false"              # http (TLS yok) için
      # Bazı kurulumlarda aşağıdakiler tercih edilir (ikisi de bırakıldı):
      WANDB_S3_ENDPOINT: http://minio:9000
      WANDB_S3_BUCKET: ${MINIO_BUCKET_NAME:-wandb-bucket}

      # --- Opsiyonel genel ayarlar ---
      # BASE_URL bir reverse proxy arkasında çalışırken gerekir:
      # BASE_URL: ${WANDB_BASE_URL}
      # DISABLE_SIGNUP: "false"

    ports:
      - "8088:8080"   # W&B Local UI
    volumes:
      - wandb_data:/vol
    networks:
      - wandb-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

  minio-init-perms:
    # The Chainguard MinIO image runs as uid 65532; make the data volume writable for it.
    image: busybox:1.37
    user: "0:0"
    command: ["chown", "-R", "65532:65532", "/data"]
    volumes:
      - minio_data:/data
    restart: "no"

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    depends_on:
      minio-init-perms:
        condition: service_completed_successfully
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    networks:
      - wandb-net

  createbuckets:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
        until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 2; done &&
        mc mb -p local/${MINIO_BUCKET_NAME:-wandb-bucket} || true &&
        mc anonymous set download local/${MINIO_BUCKET_NAME:-wandb-bucket} ||
        echo 'Bucket ${MINIO_BUCKET_NAME:-wandb-bucket} is ready.'
      "
    profiles: ["init"]
    networks:
      - wandb-net
    restart: "no"

  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wandb}
      MYSQL_USER: ${MYSQL_USER:-wandbuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wandbpass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    command: >
      --mysql-native-password=ON
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - wandb-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${MYSQL_USER:-wandbuser} -p${MYSQL_PASSWORD:-wandbpass} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  wandb_data:
    driver: local
  minio_data:
    driver: local
  mysql_data:
    driver: local

networks:
  wandb-net:
    driver: bridge

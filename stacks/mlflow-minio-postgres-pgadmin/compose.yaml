x-mlflow-creds: &mlflow-creds
  AWS_ACCESS_KEY_ID:      ${S3_ACCESS_KEY:-GKdeadbeefdeadbeefdeadbeef}
  AWS_SECRET_ACCESS_KEY:  ${S3_SECRET_KEY:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
  MLFLOW_S3_ENDPOINT_URL: http://s3:9000
  AWS_REGION:             ${AWS_REGION:-us-east-1}

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    container_name: mlflow_server
    depends_on:
      postgres:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      <<: *mlflow-creds
      # avoids boto3 SSL complaints in local dev
      AWS_SSL_VERIFY: "0"
    command: >
      /bin/sh -c "
      pip install --upgrade psycopg2-binary boto3 &&
      mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql+psycopg2://myuser:mypassword@postgres:5432/mydatabase --default-artifact-root s3://mlflow/
      "
    ports:
      - "5000:5000"
    networks:
      - mflow-stack-network

  s3:
    # S3-compatible object store (RustFS by default; compose.seaweedfs.yaml / compose.garage.yaml switch it).
    # Defined once in shared/s3/compose.yaml. The S3 API is http://s3:9000 for every variant.
    extends:
      file: ../../shared/s3/compose.yaml
      service: s3
    networks:
      - mflow-stack-network

  create-bucket:
    extends:
      file: ../../shared/s3/compose.yaml
      service: create-bucket
    environment:
      S3_BUCKETS: mlflow
    networks:
      - mflow-stack-network

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mflow-stack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-mydatabase}"]
      interval: 5s
      timeout: 5s
      retries: 10
  pgadmin:
    image: elestio/pgadmin:REL-9_18
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-adminpassword}
    depends_on:
      - postgres
    ports:
      - "5433:80"
    networks:
      - mflow-stack-network
    restart: unless-stopped

volumes:
  s3_data:
    name: ${VOLUME_PREFIX:-mlflow-minio-postgres-pgadmin}_s3_data
  postgres_data:
    name: ${VOLUME_PREFIX:-mlflow-minio-postgres-pgadmin}_postgres_data

networks:
  mflow-stack-network:
    driver: bridge
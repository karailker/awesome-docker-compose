# Small data platform: Postgres (warehouse) <- dbt <- Prefect (scheduler), explored with Metabase.
x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-platform}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
  POSTGRES_DB: ${POSTGRES_DB:-warehouse}

services:
  postgres:
    image: postgres:17
    container_name: platform-postgres
    environment:
      <<: *postgres-env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro # creates the metabase and prefect databases on first start
    networks:
      - platform
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 20

  prefect-server:
    image: ${PREFECT_IMAGE:-awesome-compose/data-platform-prefect:local} # built from ./Dockerfile
    build: .
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/prefect
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PREFECT_PORT:-4200}:4200"
    networks:
      - platform
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  pipeline:
    # Serves the "dbt-pipeline" flow (deployment dbt-hourly) and runs the dbt project in ./dbt
    image: ${PREFECT_IMAGE:-awesome-compose/data-platform-prefect:local}
    build: .
    command: python /flows/pipeline.py
    environment:
      <<: *postgres-env
      PREFECT_API_URL: http://prefect-server:4200/api
      DBT_TARGET_PATH: /tmp/dbt/target # keep the mounted project directory clean
      DBT_LOG_PATH: /tmp/dbt/logs
    depends_on:
      prefect-server:
        condition: service_healthy
    volumes:
      - ./dbt:/dbt
      - ./flows:/flows:ro
    networks:
      - platform
    restart: unless-stopped

  metabase:
    image: ${METABASE_IMAGE:-metabase/metabase:v0.64.1.3}
    container_name: platform-metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: ${POSTGRES_USER:-platform}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-platform}
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_KEY:-change-me-to-a-long-random-string-0123456789}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${METABASE_PORT:-3000}:3000"
    networks:
      - platform
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  postgres_data:
    name: ${VOLUME_PREFIX:-data-platform-postgres-dbt-prefect-metabase}_postgres_data

networks:
  platform:
    driver: bridge
